<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>HEX</title>
<meta name="description" content="Løs regnestykker og avdekk et hexagonalt brett gjennom tåken.">
<meta name="theme-color" content="#05090a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HEX">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Manrope:wght@400;500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">⬡</span>
      <div>
        <h1>HEX <span class="version" id="version">v18</span></h1>
        <span class="sub">Løs regnestykket, og ruta lyser opp gjennom tåken</span>
      </div>
    </div>
    <div class="controls">
      <div class="chip-group" id="nivaVelger" role="group" aria-label="Alderstrinn"></div>
      <select id="sizeSelect" aria-label="Brettstørrelse">
        <option value="sma">Lite brett</option>
        <option value="med" selected>Middels brett</option>
        <option value="sto">Stort brett</option>
      </select>
      <button id="newBoardBtn" class="btn-ghost">Nytt brett</button>
      <button id="grafikkKnapp" class="btn-ghost btn-stat btn-grafikk" aria-pressed="false" aria-label="Lettere grafikk">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0.6l1.5 3.8 3.8 1.5-3.8 1.5L8 11.2 6.5 7.4 2.7 5.9l3.8-1.5z"/><path d="M12.8 9.8l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg>
      </button>
      <button id="statKnapp" class="btn-ghost btn-stat" aria-label="Vis statistikk" title="Statistikk">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="9" width="3.4" height="6" rx="1.2"/><rect x="6.3" y="5" width="3.4" height="10" rx="1.2"/><rect x="11.6" y="1.5" width="3.4" height="13.5" rx="1.2"/></svg>
      </button>
    </div>
  </header>

  <div class="progress-row">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <span class="progress-label" id="progressLabel">0 / 37 ruter avdekket</span>
    <span class="brett-teller" id="brettTeller" hidden></span>
  </div>

  <div class="board-wrap">
    <svg id="board" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
</div>

<div class="oppgave-bakgrunn" id="oppgave" hidden>
  <div class="oppgave-kort" id="oppgaveKort">
    <span class="oppgave-merke" id="oppgaveMerke">+</span>
    <div class="oppgave-stykke" id="oppgaveStykke">7 + 5</div>
    <div class="oppgave-svar" id="oppgaveSvar"></div>
    <p class="oppgave-melding" id="oppgaveMelding"></p>
    <div class="tastatur" id="tastatur"></div>
    <button class="oppgave-avbryt" id="oppgaveAvbryt">Lukk</button>
  </div>
</div>

<div class="stat-bakgrunn" id="statistikk" hidden>
  <div class="stat-kort" role="dialog" aria-label="Statistikk">
    <div class="stat-topp">
      <h2>Statistikk</h2>
      <button class="stat-lukk" id="statLukk" aria-label="Lukk">✕</button>
    </div>
    <div id="statInnhold"></div>
  </div>
</div>

<script src="statistikk.js"></script>
<script src="matte.js"></script>
<script src="hexgrid.js"></script>
<script src="finale.js"></script>
<script src="app.js"></script>
</body>
</html>
